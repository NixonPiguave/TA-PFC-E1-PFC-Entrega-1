spring.application.name=turnos-pagos
server.address=${RTV_BIND_ADDRESS:127.0.0.1}
server.port=${TURNOS_PORT:8081}
spring.datasource.url=${TURNOS_DB_URL:jdbc:postgresql://127.0.0.1:55432/rtv_turnos_pagos}
spring.datasource.username=${TURNOS_DB_USER}
spring.datasource.password=${TURNOS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.jackson.parser.strict-duplicate-detection=true
rtv.token=${RTV_SERVICE_TOKEN}
