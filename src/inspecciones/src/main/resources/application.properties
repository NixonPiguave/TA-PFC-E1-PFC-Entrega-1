spring.application.name=inspecciones
server.address=${RTV_BIND_ADDRESS:127.0.0.1}
server.port=${INSPECCIONES_PORT:8082}
spring.datasource.url=${INSPECCIONES_DB_URL:jdbc:postgresql://127.0.0.1:55432/rtv_inspecciones}
spring.datasource.username=${INSPECCIONES_DB_USER}
spring.datasource.password=${INSPECCIONES_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.jackson.parser.strict-duplicate-detection=true
rtv.token=${RTV_SERVICE_TOKEN}
rtv.turnos-url=${TURNOS_URL:http://127.0.0.1:8081}
rtv.turnos-timeout=${TURNOS_TIMEOUT:3s}
